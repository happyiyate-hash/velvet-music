name: Build and Release Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as a GitHub Release (direct 1-tap APK download on phone)'
        required: false
        type: boolean
        default: true
  workflow_run:
    workflows:
      - 'Apply PlayerSheet background gradient'
    types:
      - completed

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Signing and Configuration
        shell: bash
        run: |
          chmod +x gradlew
          if [ ! -f ".env" ]; then
            if [ -f ".env.example" ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

          # CI signing key. This is intentionally generated for the CI APK;
          # production Play/App signing should use a protected repository secret.
          keytool -genkeypair -v \
            -keystore my-upload-key.jks \
            -storepass android \
            -keypass android \
            -alias upload \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Velvet Music,O=Release,C=US"

          echo "Release keystore prepared."

      - name: Build Optimized Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: android
          KEY_PASSWORD: android
        run: ./gradlew clean :app:assembleRelease --stacktrace

      - name: Prepare Signed Release APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-apks
          RELEASE_APK=$(find app/build/outputs/apk/release -type f -name "*.apk" | head -n 1)
          if [ -z "${RELEASE_APK}" ]; then
            echo "Release APK was not produced."
            exit 1
          fi

          # Gradle has already signed the release APK with the CI keystore.
          # Verify the signature and copy it to the stable artifact name.
          BUILD_TOOLS_DIR=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          "$BUILD_TOOLS_DIR/apksigner" verify --verbose "$RELEASE_APK"
          cp "$RELEASE_APK" build-apks/Velvet-Music.apk
          echo "Signed Release APK prepared: build-apks/Velvet-Music.apk"

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Velvet-Music-APK
          path: build-apks/Velvet-Music.apk
          retention-days: 30

      - name: Prepare Release Metadata
        id: release_metadata
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            RELEASE_TAG="${GITHUB_REF_NAME}"
            RELEASE_NAME="Velvet Music ${GITHUB_REF_NAME}"
          else
            RELEASE_TAG="build-${GITHUB_RUN_NUMBER}"
            RELEASE_NAME="Velvet Music (Build #${GITHUB_RUN_NUMBER})"
          fi
          echo "tag_name=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "release_name=${RELEASE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_metadata.outputs.tag_name }}
          name: ${{ steps.release_metadata.outputs.release_name }}
          body: |
            ### Velvet Music Android APK (Production Release Build)
            Install directly on your Android device:
            1. Download `Velvet-Music.apk` below directly to your Android device.
            2. Tap the downloaded file and select **Install**.
            3. If prompted by Android, enable **Allow from this source** in settings.
          files: build-apks/Velvet-Music.apk
          draft: false
          prerelease: false
