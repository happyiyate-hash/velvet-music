name: Build and Release Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as a GitHub Release (direct 1-tap APK download on phone)'
        required: false
        type: boolean
        default: true
  workflow_run:
    workflows:
      - 'Apply PlayerSheet background gradient'
    types:
      - completed

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Signing and Configuration
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x gradlew

          if [ ! -f ".env" ]; then
            if [ -f ".env.example" ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

          # Use the permanent signing keystore when it has been configured.
          # Otherwise generate an ephemeral release keystore automatically so
          # the APK build can proceed without requiring a GitHub secret.
          if [ -n "${KEYSTORE_BASE64}" ]; then
            echo "${KEYSTORE_BASE64}" | base64 --decode > my-upload-key.jks
            chmod 600 my-upload-key.jks

            if [ -z "${STORE_PASSWORD:-}" ] || [ -z "${KEY_PASSWORD:-}" ]; then
              echo "::error::KEYSTORE_BASE64 is configured, but KEYSTORE_PASSWORD and KEY_PASSWORD are missing."
              exit 1
            fi

            echo "Permanent release keystore restored."
          else
            echo "No permanent release keystore configured; generating an ephemeral signing keystore for this build."

            STORE_PASSWORD="$(openssl rand -hex 24)"
            KEY_PASSWORD="$(openssl rand -hex 24)"

            keytool -genkeypair               -keystore my-upload-key.jks               -storepass "${STORE_PASSWORD}"               -keypass "${KEY_PASSWORD}"               -alias upload               -keyalg RSA               -keysize 4096               -validity 10000               -dname "CN=Velvet Music, OU=Android, O=Velvet Music, L=Unknown, ST=Unknown, C=NG"

            chmod 600 my-upload-key.jks
            echo "Ephemeral release keystore generated successfully."
          fi

          # Pass the selected/generated signing configuration to the Gradle step.
          {
            echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/my-upload-key.jks"
            echo "STORE_PASSWORD=${STORE_PASSWORD}"
            echo "KEY_PASSWORD=${KEY_PASSWORD}"
          } >> "${GITHUB_ENV}"

      - name: Apply Latest Release Compile Fixes
        shell: bash
        run: python3 scripts/fix_latest_release_compile_errors.py

      - name: Build Optimized Release APK
        run: ./gradlew clean :app:assembleRelease --stacktrace

      - name: Prepare Signed Release APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-apks
          RELEASE_APK=$(find app/build/outputs/apk/release -type f -name "*.apk" | head -n 1)
          if [ -z "${RELEASE_APK}" ]; then
            echo "Release APK was not produced."
            exit 1
          fi

          # Gradle has already signed the release APK with the permanent keystore.
          # Verify the signature and copy it to the stable artifact name.
          BUILD_TOOLS_DIR=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          "$BUILD_TOOLS_DIR/apksigner" verify --verbose "${RELEASE_APK}"
          cp "${RELEASE_APK}" build-apks/Velvet-Music.apk
          echo "Signed Release APK prepared: build-apks/Velvet-Music.apk"

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Velvet-Music-APK
          path: build-apks/Velvet-Music.apk
          retention-days: 30

      - name: Prepare Release Metadata
        id: release_metadata
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            RELEASE_TAG="${GITHUB_REF_NAME}"
            RELEASE_NAME="Velvet Music ${GITHUB_REF_NAME}"
          else
            RELEASE_TAG="build-${GITHUB_RUN_NUMBER}"
            RELEASE_NAME="Velvet Music (Build #${GITHUB_RUN_NUMBER})"
          fi
          echo "tag_name=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "release_name=${RELEASE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_metadata.outputs.tag_name }}
          name: ${{ steps.release_metadata.outputs.release_name }}
          body: |
            ### Velvet Music Android APK (Production Release Build)
            Install directly on your Android device:
            1. Download `Velvet-Music.apk` below directly to your Android device.
            2. Tap the downloaded file and select **Install**.
            3. If prompted by Android, enable **Allow from this source** in settings.
          files: build-apks/Velvet-Music.apk
          draft: false
          prerelease: false