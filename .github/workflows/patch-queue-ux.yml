name: Apply Queue UX Fixes
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Patch queue behavior and visuals
        run: python3 scripts/patch_queue_ux.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/ui/PlayerSheet.kt app/src/main/java/com/example/audio/VelvetAudioEngine.kt
          git diff --cached --quiet && exit 0
          git commit -m "fix: refine queue colors, gestures and track order"
          git push origin HEAD:main
