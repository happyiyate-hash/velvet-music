name: Apply PlayerSheet v4b cleanup

on:
  push:
    branches: [main]
    paths:
      - 'scripts/player_sheet_v4b_cleanup.py'
      - '.github/workflows/apply-player-sheet-v4b.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Remove duplicate expanded progress bar
        run: python3 scripts/player_sheet_v4b_cleanup.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/ui/PlayerSheet.kt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(ui): remove duplicate expanded progress bar"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
