name: Apply PlayerSheet transition refinement

on:
  push:
    branches: [main]

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply PlayerSheet patch script
        run: python3 scripts/refine_player_sheet.py
      - name: Commit PlayerSheet patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/ui/PlayerSheet.kt scripts/refine_player_sheet.py
          if git diff --cached --quiet; then
            echo "No PlayerSheet changes to commit."
            exit 0
          fi
          git commit -m "fix(player): refine YouTube-style sheet transition"
          git push
