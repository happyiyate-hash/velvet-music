name: Restore PlayerSheet reference components

on:
  push:
    paths:
      - 'scripts/restore_player_sheet_reference_components.py'
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply reference components and color extraction fix
        run: python3 scripts/restore_player_sheet_reference_components.py

      - name: Commit patched source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/example/ui/PlayerSheet.kt app/src/main/java/com/example/media/ArtworkColorExtractor.kt
          git diff --cached --quiet && exit 0
          git commit -m 'Restore PlayerSheet reference rendering and fix artwork color extraction'
          git push
