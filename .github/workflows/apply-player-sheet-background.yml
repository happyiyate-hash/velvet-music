name: Apply PlayerSheet background gradient

on:
  push:
    paths:
      - 'scripts/fix_queue_swipe_compile.py'
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply safe PlayerSheet repair
        run: |
          python3 scripts/fix_queue_swipe_compile.py
      - name: Commit PlayerSheet repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/example/ui/PlayerSheet.kt
          git diff --cached --quiet && exit 0
          git commit -m 'Apply safe PlayerSheet repair'
          git push
