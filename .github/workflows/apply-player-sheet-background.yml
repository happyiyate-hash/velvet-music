name: Apply PlayerSheet background gradient

on:
  push:
    paths:
      - 'scripts/player_sheet_background_gradient.py'
      - 'scripts/player_sheet_queue_patch.py'
      - 'scripts/player_sheet_queue_drag_patch.py'
      - 'scripts/player_sheet_swipe_action_patch.py'
      - 'scripts/fix_swipe_action_source.py'
      - 'scripts/queue_drag_trigger.py'
      - 'scripts/fix_queue_drag_brace.py'
      - 'scripts/fix_queue_drag_compile.py'
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply PlayerSheet patches
        run: |
          sed -i 's/animatedPlayerBackground/themeColors.bgBottom/g' app/src/main/java/com/example/ui/PlayerSheet.kt
          python3 scripts/player_sheet_background_gradient.py
          python3 scripts/player_sheet_queue_patch.py
          python3 scripts/player_sheet_queue_drag_patch.py
          python3 scripts/fix_queue_drag_brace.py
          python3 scripts/fix_queue_drag_compile.py
          python3 scripts/player_sheet_swipe_action_patch.py
          python3 scripts/fix_swipe_action_source.py
      - name: Commit PlayerSheet patches
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/example/ui/PlayerSheet.kt
          git diff --cached --quiet && exit 0
          git commit -m 'Apply two-stage queue swipe actions'
          git push
