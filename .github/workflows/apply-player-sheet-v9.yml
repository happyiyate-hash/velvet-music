name: Apply PlayerSheet v9

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/player_sheet_v9_box_artwork.py'

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply PlayerSheet v9 patch
        run: python3 scripts/player_sheet_v9_box_artwork.py
      - name: Commit PlayerSheet v9
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/example/ui/PlayerSheet.kt
          git diff --cached --quiet && exit 0
          git commit -m 'Fix PlayerSheet rectangular artwork and anchored fade'
          git push
