name = "velvet-recognition"
main = "src/index.ts"
compatibility_date = "2026-09-15"

[vars]
# Set these as Cloudflare Worker secrets, not in this file:
# AUDD_API_TOKEN
# ACRCLOUD_HOST
# ACRCLOUD_ACCESS_KEY
# ACRCLOUD_ACCESS_SECRET
# SOUNDCLOUD_CLIENT_ID
# SOUNDCLOUD_CLIENT_SECRET

[[kv_namespaces]]
binding = "SOUNDCLOUD_KV"
# Set this to the ID of your production KV namespace.
# id = "<SOUNDCLOUD_KV_NAMESPACE_ID>"
